<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>$title</title>
    $favicon
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('theme');
                var dark = stored ? stored === 'dark'
                    : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (dark) document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) {}
        })();
    </script>
    <style>
        :root {
            color-scheme: light;
            --link-color: #245ea8;
            --text-color: #242424;
            --light-text: #666666;
            --background-color: #ffffff;
            --section-bg: #f6f6f6;
            --border-color: #dedede;
            --tint: rgba(0, 0, 0, 0.06);
        }

        [data-theme="dark"] {
            color-scheme: dark;
            --link-color: #8ab4f8;
            --text-color: #f2f2f2;
            --light-text: #c7c7c7;
            --background-color: #171717;
            --section-bg: #101010;
            --border-color: #3a3a3a;
            --tint: rgba(255, 255, 255, 0.08);
        }

        *, *::before, *::after { box-sizing: border-box; }

        html {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            margin: 0;
            background: var(--section-bg);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 1rem;
            line-height: 1.7;
        }

        header, main {
            width: min(72rem, calc(100% - 48px));
            margin-inline: auto;
        }

        header { padding: 56px 0 8px; }
        main { padding-bottom: 72px; }

        a { color: var(--link-color); text-underline-offset: 0.2em; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            font-weight: 500;
            text-decoration: none;
        }

        .back-link:hover span { text-decoration: underline; }

        h1 {
            margin: 24px 0 8px;
            font-size: clamp(1.9rem, 5vw, 2.6rem);
            line-height: 1.2;
            text-wrap: balance;
        }

        article {
            padding: 32px;
            background: var(--background-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
        }

        article > :first-child { margin-top: 0; }
        article > :last-child { margin-bottom: 0; }

        article h1, article h2, article h3, article h4 {
            margin: 2em 0 0.6em;
            line-height: 1.3;
            text-wrap: balance;
        }

        article h2 {
            padding-bottom: 0.3em;
            border-bottom: 1px solid var(--border-color);
            font-size: 1.5rem;
        }

        article h3 { font-size: 1.2rem; }
        article img { max-width: 100%; height: auto; }

        article blockquote {
            margin: 1.5em 0;
            padding: 0.2em 1.2em;
            border-left: 3px solid var(--link-color);
            color: var(--light-text);
        }

        article code {
            padding: 0.15em 0.4em;
            background: var(--tint);
            border-radius: 4px;
            font-size: 0.9em;
        }

        article pre {
            overflow-x: auto;
            padding: 16px;
            background: var(--section-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        article pre code { padding: 0; background: none; }
        .table-scroll, article table { display: block; overflow-x: auto; }
        article table { border-collapse: collapse; width: 100%; }

        article th, article td {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        article th { background: var(--tint); }
        article hr { border: none; border-top: 1px solid var(--border-color); }

        @media (max-width: 640px) {
            header, main { width: min(100% - 24px, 72rem); }
            header { padding-top: 24px; }
            article { padding: 20px; }
        }
    </style>
</head>
<body>
    <header>
        <a class="back-link" href="$prefix">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>Back to artefacts</span>
        </a>
        <h1>$title</h1>
    </header>

    <main>
        <article id="markdown-body"></article>
    </main>

$block_start$markdown$block_end
    <script src="$prefix$vendor"></script>
    <script>
        (function () {
            var raw = document.getElementById('artefact-source').textContent;
            var text = raw.replace(/<(\\+)(\/script|!--)/gi, function (match, slashes, marker) {
                return '<' + slashes.slice(1) + marker;
            });
            var body = document.getElementById('markdown-body');
            body.innerHTML = marked.parse(text);
            var lead = body.querySelector('h1');
            var heading = document.querySelector('header h1');
            if (lead && heading && lead.textContent.trim() === heading.textContent.trim()) {
                lead.remove();
            }
        })();
    </script>
</body>
</html>
